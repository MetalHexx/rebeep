; RBSTUDIO.CFG: settings for ReBeep Studio and for ReBeep's startup.
; Copy this file next to RBSTUDIO.EXE. It is optional. Each line is off
; until you remove the leading semicolon.
;
; PATCHES= is the folder that holds USER and your other banks. A plain DOS
; path of 8.3 names; one with no drive or leading backslash counts from the
; program's folder. The default is PATCHES, beside the program.
;PATCHES=D:\MYSOUNDS
;
; PATCH= is the patch ReBeep loads at startup when REBEEP has no /F or /P:.
; A name is looked up in USER, then FACTORY; BANK\NAME names one file.
;PATCH=FLUTE
;
; PROFILES= is the folder that holds the game profiles REBEEP /G: loads, a
; folder each. The same kind of path. The default is PROFILES, beside the
; program.
;PROFILES=D:\MYGAMES
