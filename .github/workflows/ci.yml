name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    name: tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the payload guard scans every commit in the range

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NASM and dosfstools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y nasm dosfstools
          command -v fsck.fat   # the FAT image tests skip themselves without it
          nasm -v

      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm
          nasm -v

      - name: Use a throwaway rebeep home
        shell: bash
        run: echo "REBEEP_HOME=$RUNNER_TEMP/rebeep-home" >> "$GITHUB_ENV"

      - name: Host check
        run: node tools/rebeep.mjs env check

      - name: Version check
        run: node tools/rebeep.mjs version check

      - name: Tools tests (fsck.fat checks the FAT images on Linux)
        run: node tools/rebeep.mjs test run --suite tools

      - name: Fetch NASM (pinned on Windows, system NASM elsewhere)
        run: node tools/rebeep.mjs tool fetch nasm

      - name: Fetch Open Watcom (pinned snapshot, unpacked with the host's tar)
        run: node tools/rebeep.mjs tool fetch open-watcom

      - name: Build
        run: node tools/rebeep.mjs build run

      - name: Package dry run
        run: node tools/rebeep.mjs release create --skip-build

      - name: Site build and check (offline, so no release lookup)
        run: |
          node tools/rebeep.mjs site create --offline
          node tools/rebeep.mjs site check

      - name: Check the floppy image (Linux)
        if: runner.os == 'Linux'
        run: fsck.fat -n build/release/*-floppy.img

      - name: Fetch DOSBox-X (Windows only)
        if: runner.os == 'Windows'
        run: node tools/rebeep.mjs tool fetch dosbox-x

      - name: Interpreter tests (DOSBox-X, Windows only)
        if: runner.os == 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: node tools/rebeep.mjs test run --suite interpreter

      - name: Studio tests (Open Watcom and DOSBox-X, Windows only)
        if: runner.os == 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: node tools/rebeep.mjs test run --suite studio

      - name: Payload guard
        run: node tools/rebeep.mjs repo check --range origin/main..HEAD --strict
